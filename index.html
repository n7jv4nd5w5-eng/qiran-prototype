<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启然美团数据看板 · 原型</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f5; --card:#fff; --ink:#1f2329; --sub:#6b7280; --line:#e5e7eb;
  --primary:#067579; --primary-soft:#e6f2f2; --success:#15803d; --danger:#b91c1c;
  --warning:#b45309; --amber-bg:#fdf6ec;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--primary);text-decoration:none}

/* top nav */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;height:52px}
.logo{font-weight:800;font-size:17px;color:var(--primary);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.logo b{background:var(--primary);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav .grp{position:relative}
nav .grp>a,nav>a{padding:6px 12px;border-radius:8px;color:#374151;white-space:nowrap;cursor:pointer;font-size:14px}
nav .grp>a:hover,nav>a:hover{background:var(--primary-soft);color:var(--primary)}
nav .cur>a,nav .cur{background:var(--primary);color:#fff}
nav .sub{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.09);padding:6px;display:none;min-width:150px;z-index:30}
nav .grp:hover .sub{display:block}
nav .sub a{display:block;padding:7px 12px;border-radius:7px;color:#374151;white-space:nowrap}
nav .sub a:hover{background:var(--primary-soft);color:var(--primary)}
nav .sub a.on{background:var(--primary);color:#fff}
.plat{display:flex;border:1px solid var(--primary);border-radius:8px;overflow:hidden}
.plat button{border:none;background:#fff;color:var(--primary);padding:5px 14px;cursor:pointer;font-size:13px}
.plat button.on{background:var(--primary);color:#fff}
.crumb{max-width:1440px;margin:0 auto;padding:10px 20px 0;color:var(--sub);font-size:13px}
.crumb b{color:var(--ink)}

.wrap{max-width:1440px;margin:0 auto;padding:12px 20px 60px}

/* filter bar */
.fbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.fbar .rg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fbar .rg button{border:none;background:#fff;padding:5px 12px;cursor:pointer;font-size:13px;color:#374151}
.fbar .rg button.on{background:var(--primary);color:#fff}
.fbar .dates{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.fbar .dates input{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px}
.fbar select,.fbar .search{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;background:#fff;color:var(--ink);min-width:96px}
.fbar .search{width:150px}
.fbar .btn{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}
.fbar .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.fbar label{font-size:12px;color:var(--sub)}

/* generic */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:4px}
.panel .desc{font-size:12px;color:var(--sub);margin-bottom:10px}
.chart{width:100%;height:300px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--sub);background:var(--amber-bg);border:1px solid #f3e3c8;border-radius:8px;padding:8px 12px;margin-bottom:14px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}
.kpi .d{font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.up{color:var(--success);font-weight:700}
.down{color:var(--danger);font-weight:700}
.kpi .vs{color:var(--sub)}

/* alert cards */
.agroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.acard h4{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between}
.acard h4 span{color:var(--danger);font-weight:800}
.arow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.arow .n{min-width:38px;font-weight:800;font-size:16px;color:var(--danger)}
.arow .n.zero{color:var(--sub)}
.arow .r{flex:1}
.arow .t{font-size:11.5px;color:var(--sub)}
.arow.clickable{cursor:pointer}
.arow.clickable:hover{background:var(--primary-soft);border-radius:6px}

/* rank lists */
.rank{display:flex;gap:14px}
.rank>div{flex:1}
.rrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.rrow:hover{background:var(--primary-soft)}
.rrow .no{width:22px;height:22px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}
.rrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .val{font-weight:700}
.bad .rrow .no{background:#fdecec;color:var(--danger)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f7f8f9;color:var(--sub);font-weight:600;padding:8px 6px;text-align:center;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:hover td{background:#f7fbfb}
.tbl-wrap{overflow:auto;max-height:520px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-gold{background:#fdf3d7;color:#b45309}
.tag-none{background:#eef0f2;color:#889}
.good{color:var(--success);font-weight:700}
.bad{color:var(--danger);font-weight:700}

/* tabs & segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.seg button{border:none;background:#fff;padding:6px 16px;cursor:pointer;font-size:13px;color:#374151}
.seg button.on{background:var(--primary);color:#fff}
h2.pt{font-size:18px;font-weight:800;margin:4px 0 2px}
.pt-sub{font-size:12.5px;color:var(--sub);margin-bottom:14px}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kpi3 .panel{text-align:center;margin-bottom:0}
.kpi3 .panel .v{font-size:22px;font-weight:800;color:var(--primary)}
.kpi3 .panel .l{font-size:12.5px;color:var(--sub);margin-top:2px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1}
</style>
</head>

<div class="topbar"><div class="topbar-in">
  <div class="logo"><b>启然</b>美团数据看板 <span style="font-weight:400;font-size:11px;color:var(--sub)">原型</span></div>
  <nav id="nav"></nav>
  <div class="plat"><button class="on">美团数据</button><button onclick="toast('抖音数据接口待接入')">抖音数据</button></div>

<div class="crumb" id="crumb"></div>

<div class="wrap">

/* deterministic pseudo-random: same result every load */
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dayW={};   // store -> normalized 16-day weights
const prevF={};  // store|metric -> previous-period factor (0.85~1.15)
function weights(store){
  if(dayW[store])return dayW[store];
  const r=rng(hash(store));const w=[...Array(16)].map(()=>0.4+r());
  const s=w.reduce((a,b)=>a+b,0);return dayW[store]=w.map(x=>x/s);
}
function factor(store,metric){
  const k=store+'|'+metric;
  if(prevF[k])return prevF[k];
  const r=rng(hash(k));return prevF[k]=0.85+r()*0.30;
}

const LS_KEY='qiranProtoData';

function persistData(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(DATA));return true}
  catch(e){toast('数据较大，仅本次会话内生效（浏览器本地存储已满）');return false}
}
function importFiles(files){
  if(!files||!files.length)return;
  const list=[...files];const merged=[];const errs=[];const seen={};
  (function next(i){
    if(i>=list.length)return finish();
    const f=list[i];const fr=new FileReader();
    fr.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets['明细数据']||wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
        rows.forEach(r=>{if(r[C.store]!=null&&r[C.store]!=='')merged.push(r)});
      }catch(err){errs.push(f.name)}
      next(i+1);
    };
    fr.onerror=()=>{errs.push(f.name);next(i+1)};
    fr.readAsArrayBuffer(f);
  })(0);
  function finish(){
    if(!merged.length){toast('未解析到有效数据行'+(errs.length?'；失败文件：'+errs.join('、'):''));return}
    merged.forEach(r=>seen[r[C.store]]=r);
    let updated=0,added=0;
    const idx={};DATA.forEach((r,i)=>idx[r[C.store]]=i);
    Object.values(seen).forEach(r=>{
      if(idx[r[C.store]]!=null){DATA[idx[r[C.store]]]=r;updated++}
      else{DATA.push(r);added++}
    });
    persistData();
    $('dataSrc').textContent='本机导入数据 · '+DATA.length+' 家门店';
    fillAll();resetFilters();
    toast('导入完成：更新 '+updated+' 家 · 新增 '+added+' 家 · 共 '+DATA.length+' 家'+(errs.length?'；失败：'+errs.join('、'):''));
  }
}

/* ---------- aggregates ---------- */
function sum(rows,col){return rows.reduce((a,r)=>a+F(r[col]),0)}
function daily(rows,col){ // aggregated per-day series (demo distribution)
  const out=[...Array(16)].map(()=>0);
  rows.forEach(r=>{const t=F(r[col]);if(!t)return;const w=weights(r[C.store]);
    for(let i=0;i<16;i++)out[i]+=t*w[i]});
  return out;
}
function prevTotal(rows,col){return sum(rows,col)/avgFactor(rows,col)}
function avgFactor(rows,col){
  if(!rows.length)return 1;
  return rows.reduce((a,r)=>a+factor(r[C.store],col),0)/rows.length;
}

function dualChart(id,title,col,fmt){
  const rows=view();
  const cur=daily(rows,col);
  const prev=cur.map((v,i)=>{
    const dayPrev=cur.map(()=>0);return v});
  const prevS=daily(rows,col).map((v,i)=>v*avgFactor(rows,col));
  const mx=Math.max(...cur,...prevS)*1.15||1;
  chart(id,{
    title:{text:title,left:0,top:0,textStyle:{fontSize:13,fontWeight:700}},
    tooltip:TIP,legend:{top:0,right:0,textStyle:{fontSize:11}},
    grid:{...GRID,top:60},
    xAxis:{type:'category',data:DATES,axisLabel:{fontSize:10}},
    yAxis:[{type:'value',max:mx},{type:'value',axisLabel:{formatter:'{value}%'},splitLine:{show:false}}],
    series:[
      {name:'本期',type:'line',smooth:true,symbolSize:5,data:cur.map(v=>+v.toFixed(1)),itemStyle:{color:'#067579'},lineStyle:{width:2.5}},
      {name:'上期',type:'line',smooth:true,symbolSize:5,data:prevS.map(v=>+v.toFixed(1)),itemStyle:{color:'#9cc4c6'},lineStyle:{width:2,type:'dashed'}},
      {name:'环比',yAxisIndex:1,type:'line',smooth:true,symbol:'none',data:cur.map((v,i)=>prevS[i]>0?+(((v-prevS[i])/prevS[i])*100).toFixed(1):0),itemStyle:{color:'#b45309'},lineStyle:{width:1.5,opacity:.7}},
    ]});
}

const TOPN_METRICS=[[C.yzNew,'伊智新客数'],[C.gmv,'GMV'],[C.goodT,'有效好评总数'],[C.orderC,'下单券数']];
let topnTab=0,topnMetric=0;
function pTopn(){
  const tabs=['规模榜','效率榜','改善榜'];
  $('view').innerHTML=`
  <h2 class="pt">经营排行榜</h2>
  <div class="pt-sub">规模榜看真实产出 · 效率榜看核销与获客效率 · 改善榜看谁比上期进步更快（演示口径）· 零值门店不进入榜单</div>
  <div class="seg">${tabs.map((t,i)=>`<button class="${i===topnTab?'on':''}" onclick="topnTab=${i};pTopn()">${t}</button>`).join('')}</div>
  <div style="margin-bottom:12px"><label style="font-size:12px;color:var(--sub)">指标</label>
  <select onchange="topnMetric=this.selectedIndex;pTopn()" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px">
  ${TOPN_METRICS.map((m,i)=>`<option ${i===topnMetric?'selected':''}>${m[1]}</option>`).join('')}</select></div>
  <div class="panel"><div id="topnBody"></div></div>`;
  const rows=view();
  const col=TOPN_METRICS[topnMetric][0];
  let list=rows.filter(r=>F(r[col])>0);
  if(topnTab===0){
    list=list.sort((a,b)=>F(b[col])-F(a[col]));
    $('topnBody').innerHTML=rankTable(list,col,'较中位数');
  }else if(topnTab===1){
    list=list.map(r=>({r,eff:F(r[C.useRate])})).sort((a,b)=>b.eff-a.eff).map(x=>x.r);
    $('topnBody').innerHTML=rankTable(list,C.useRate,'核销率');
  }else{
    list=list.map(r=>({r,d:((F(r[col])-F(r[col])/factor(r[C.store],col))/(F(r[col])/factor(r[C.store],col)||1))*100}))
      .sort((a,b)=>b.d-a.d).map(x=>x.r);
    $('topnBody').innerHTML=rankTable(list,col,'较上期');
  }
}
function rankTable(list,col,altLabel){
  const med=list.length?F(list[Math.floor(list.length/2)][col]):0;
  return `<div class="desc" style="font-size:12px;color:var(--sub);margin-bottom:8px">
    前期 2026-09-01 至 2026-09-16 · 门店数 ${list.length} · 同组中位数 ${M(med)} · 有效样本 ${list.length}</div>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>门店</th><th>区域</th><th>责任运营</th><th>${altLabel==='核销率'?'核销率':TOPN_METRICS[topnMetric][1]}</th><th>${altLabel}</th><th>推广花费</th><th>行动标签</th></tr></thead>
  <tbody>${list.slice(0,15).map((r,i)=>{
    const v=F(r[col]);const d=(v-med)/(med||1)*100;
    const prev=v/factor(r[C.store],col);const dd=prev?((v-prev)/prev*100):0;
    return `<tr><td><b>${i+1}</b></td><td>${r[C.store]}</td><td>${r[C.prov]||''} / ${r[C.city]||''}</td><td>${r[C.ops]||'—'}</td>
    <td><b>${col===C.useRate?P(v):M(v)}</b></td>
    <td>${altLabel==='核销率'?(v>=0.85?'<span class="good">高效</span>':v<0.75?'<span class="bad">偏弱</span>':'—'):
      (altLabel==='较上期'?`<span class="${dd>=0?'good':'bad'}">${dd>=0?'+':''}${dd.toFixed(1)}%</span>`:
      (d>=0?'<span class="good">高于 ':'<span class="bad">低于 ')+Math.abs(d).toFixed(1)+'%</span>')}</td>
    <td>${F(r[C.adSpend])?'¥'+Math.round(F(r[C.adSpend])).toLocaleString():'¥0'}</td>
    <td><span class="tag ${v>=med?'tag-gold':'tag-none'}">${v>=med?'规模领先':'待提升'}</span></td></tr>`}).join('')}</tbody></table></div>`;
}
